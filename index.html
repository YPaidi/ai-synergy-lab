<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FASS/AI-Synergy-Lab</title>
<meta name="description" content="Platform FASS untuk menghimpun idea penyelidikan, pengajaran dan pentadbiran, dan memadankannya dengan kepakaran AI.">
<style>
:root{
  --bg:#f5f4ef;--surface:#ffffff;--surface2:#efede6;--text:#1c1f26;--muted:#5f6573;--line:#dcd9cf;
  --accent:#235b8f;--accent-soft:#e2ebf5;--accent2:#7a3e9d;--accent2-soft:#f1e8f6;
  --ok:#2b7a4b;--ok-soft:#e0f1e7;--warn:#9a5c12;--warn-soft:#fbeedb;--danger:#b23b3b;--danger-soft:#f8e3e3;
  --radius:14px;--shadow:0 1px 2px rgba(0,0,0,.05),0 6px 20px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#14161b;--surface:#1d2027;--surface2:#262a32;--text:#e8e9ec;--muted:#a0a6b2;--line:#353a44;
  --accent:#86b6e6;--accent-soft:#21344a;--accent2:#c9a0e3;--accent2-soft:#33263d;--ok:#72cf98;--ok-soft:#1b3326;--warn:#efb466;--warn-soft:#3a2c19;--danger:#f08585;--danger-soft:#3d2224;--shadow:none}
}
:root[data-theme="dark"]{--bg:#14161b;--surface:#1d2027;--surface2:#262a32;--text:#e8e9ec;--muted:#a0a6b2;--line:#353a44;
  --accent:#86b6e6;--accent-soft:#21344a;--accent2:#c9a0e3;--accent2-soft:#33263d;--ok:#72cf98;--ok-soft:#1b3326;--warn:#efb466;--warn-soft:#3a2c19;--danger:#f08585;--danger-soft:#3d2224;--shadow:none}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent)}
header{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;gap:12px;padding:12px 0 6px}
.logo{height:46px;width:auto;max-width:170px;object-fit:contain;flex:none;background:#fff;border-radius:8px;padding:2px 4px}
.logo-fb{width:42px;height:42px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
@media (max-width:640px){.logo{height:36px;max-width:120px}}
.sec-h{display:flex;align-items:center;gap:10px;margin:22px 0 12px}
.sec-h h2{margin:0}
.sec-h .ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex:none}
.sec-h.core .ic{background:var(--accent);color:#fff}.sec-h.partner .ic{background:var(--accent2);color:#fff}
.person{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:flex;gap:12px;align-items:flex-start}
.person img,.person .av{width:64px;height:64px;border-radius:50%;object-fit:cover;object-position:center top;flex:none;background:var(--surface2)}
.person .av{display:grid;place-items:center;font-weight:700;color:var(--accent);background:var(--accent-soft);font-size:18px}
.person .t{font-weight:650;line-height:1.3}
.person p{margin:2px 0;font-size:13.5px;color:var(--muted)}
.person a{font-size:13.5px;word-break:break-all}
.credit{display:block;margin-top:4px}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.brand{font-weight:750;font-size:17px;line-height:1.2;margin-right:auto;min-width:0}
.brand small{display:block;font-weight:400;font-size:12.5px;color:var(--muted)}
.lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.lang button{border:0;background:none;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer;color:var(--muted)}
.lang button.on{background:var(--accent);color:#fff}
nav{display:flex;gap:2px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:none;border:0;padding:8px 12px;border-radius:8px;color:var(--muted);font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
nav button:hover{color:var(--text)}
nav button.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav button.admin{margin-left:auto}
.demo{background:var(--warn-soft);color:var(--warn);font-size:13px;padding:7px 0;border-bottom:1px solid var(--line)}
main{padding:24px 0 64px}
section.view{display:none}section.view.on{display:block}
h1{font-size:26px;line-height:1.25;margin:0 0 6px}h2{font-size:19px;margin:0 0 12px}h3{font-size:15px;margin:18px 0 8px}
.lead{color:var(--muted);margin:0 0 20px;max-width:760px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
.hero{position:relative;overflow:hidden;border-radius:22px;margin-bottom:26px;color:#fff;padding:40px 36px;
  background:radial-gradient(600px 300px at 85% 20%,rgba(140,110,255,.45),transparent 70%),radial-gradient(500px 300px at 10% 110%,rgba(56,189,248,.35),transparent 70%),linear-gradient(135deg,#0b2545 0%,#1b4f8a 50%,#4c2a85 100%);
  display:grid;grid-template-columns:1.25fr 1fr;gap:20px;align-items:center;box-shadow:0 10px 40px rgba(20,30,70,.25)}
.hero::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.14) 1px,transparent 1px);background-size:22px 22px;mask-image:linear-gradient(90deg,transparent,#000 60%);-webkit-mask-image:linear-gradient(90deg,transparent,#000 60%);pointer-events:none}
.hero>*{position:relative}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);padding:5px 12px;border-radius:999px;margin-bottom:14px}
.eyebrow i{width:7px;height:7px;border-radius:50%;background:#5eead4;box-shadow:0 0 0 4px rgba(94,234,212,.25)}
.hero-logo{display:inline-block;background:#fff;border-radius:14px;padding:10px 16px;margin-bottom:18px;box-shadow:0 6px 20px rgba(0,0,0,.18);max-width:100%}
.hero-logo img{display:block;height:58px;width:auto;max-width:100%}
@media (max-width:640px){.hero-logo img{height:auto;width:100%;max-width:300px}}
.hero h1{font-size:40px;line-height:1.12;margin:0 0 8px;letter-spacing:-.02em}
.hero h1 .hl{display:block;white-space:nowrap;background:linear-gradient(90deg,#7dd3fc,#c4b5fd,#f0abfc);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .sub{font-size:14px;font-weight:600;opacity:.75;margin:0 0 12px;letter-spacing:.02em}
.hero p.lead2{max-width:620px;opacity:.9;margin:0 0 16px;font-size:15.5px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 20px}
.pills span{font-size:12.5px;padding:4px 11px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18)}
.hero .btn{border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:#fff}
.hero .btn:hover{background:rgba(255,255,255,.16);border-color:#fff}
.hero .btn.primary{background:#fff;color:#0b2545;border-color:#fff}
.hero .btn.primary:hover{filter:none;background:#e0ecff}
.hstats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:24px;max-width:620px}
.hstats div{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:10px 12px}
.hstats b{display:block;font-size:24px;line-height:1.1}
.hstats span{font-size:12px;opacity:.8}
.hero-art{width:100%;max-width:400px;justify-self:center}
.hero-art .flow-l{stroke-dasharray:4 7;animation:dash 1.6s linear infinite}
.hero-art .orbit{transform-origin:200px 170px;animation:spin 40s linear infinite}
.hero-art .pulse{transform-origin:200px 170px;animation:pulse 3s ease-in-out infinite}
.hero-art .node{animation:float 6s ease-in-out infinite}
.hero-art .node:nth-of-type(2){animation-delay:-1.5s}.hero-art .node:nth-of-type(3){animation-delay:-3s}.hero-art .node:nth-of-type(4){animation-delay:-4.5s}
@keyframes dash{to{stroke-dashoffset:-22}}@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.18);opacity:0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){.hero-art *{animation:none!important}}
@media (max-width:860px){.hero{grid-template-columns:1fr;padding:28px 20px}.hero-art{max-width:300px;margin:4px auto -10px}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:860px){.grid4{grid-template-columns:1fr 1fr}}
@media (max-width:640px){.grid2{grid-template-columns:1fr}.hero h1{font-size:30px}h1{font-size:22px}.hstats{grid-template-columns:repeat(2,1fr)}.hero-art{max-width:240px}}
.role{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:6px}
.role .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center}
.role b{font-size:15.5px}.role small{color:var(--muted);font-size:12.5px;margin-top:-6px}
.role p{margin:0;font-size:14px;color:var(--muted);flex:1}
.r-core .ic{background:var(--accent);color:#fff}.r-associate .ic{background:var(--accent2);color:#fff}
.r-project .ic{background:var(--ok-soft);color:var(--ok)}.r-idea .ic{background:var(--warn-soft);color:var(--warn)}
label.f{display:block;font-weight:600;font-size:14px;margin-bottom:5px}
.hint{font-weight:400;color:var(--muted);font-size:13px}
.req{color:var(--danger)}
input[type=text],input[type=email],input[type=url],input[type=password],input[type=search],select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--text);font:inherit}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.row{margin-bottom:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:14px;background:var(--surface)}
.chips input{accent-color:var(--accent);margin:0}
.chips label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:640px){.choice{grid-template-columns:1fr}}
.choice label{border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;background:var(--surface)}
.choice label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.choice input{margin-top:4px;accent-color:var(--accent)}
.choice b{display:block}.choice span{font-size:13px;color:var(--muted)}
.check{display:flex;gap:8px;align-items:flex-start;font-size:14px;margin:6px 0}
.check input{margin-top:3px;accent-color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--text);padding:9px 15px;border-radius:9px;font:inherit;font-size:14px;cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.55;cursor:wait}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.notice{border-radius:10px;padding:12px 14px;margin:12px 0;font-size:14px}
.notice.ok{background:var(--ok-soft);color:var(--ok)}
.notice.warn{background:var(--warn-soft);color:var(--warn)}
.notice.err{background:var(--danger-soft);color:var(--danger)}
.notice.info{background:var(--accent-soft);color:var(--accent)}
.ref{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;font-size:20px;letter-spacing:.04em}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
@media (max-width:720px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.stat b{display:block;font-size:26px;line-height:1.2}.stat span{color:var(--muted);font-size:13px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filters>*{flex:1 1 160px;width:auto}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
@media (max-width:400px){.cards{grid-template-columns:1fr}}
.icard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:8px;cursor:pointer}
.icard:hover{border-color:var(--accent)}
.icard .t{font-weight:650;font-size:15.5px;line-height:1.35}
.icard p{margin:0;font-size:14px;color:var(--muted)}
.icard .meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:auto}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.st-new{background:var(--warn-soft);color:var(--warn)}
.st-review,.st-feasible{background:var(--accent-soft);color:var(--accent)}
.st-matched,.st-progress,.st-done{background:var(--ok-soft);color:var(--ok)}
.st-parked,.st-archived{background:var(--surface2);color:var(--muted)}
.ty-project{background:var(--ok-soft);color:var(--ok)}.ty-idea{background:var(--warn-soft);color:var(--warn)}
.ro-core{background:var(--accent);color:#fff}.ro-associate{background:var(--accent2-soft);color:var(--accent2)}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:6px;background:var(--surface2);color:var(--muted);margin:2px 4px 2px 0}
.tag.hit{background:var(--ok-soft);color:var(--ok);font-weight:600}
.cat{font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--accent)}
.flow{counter-reset:s;list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:860px){.flow{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.flow{grid-template-columns:1fr}}
.flow li{counter-increment:s;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 14px 14px 52px;position:relative;font-size:14px}
.flow li b{display:block;font-size:14.5px}
.flow li::before{content:counter(s);position:absolute;left:14px;top:14px;width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px;display:grid;place-items:center}
ul.clean{margin:0;padding-left:20px}ul.clean li{margin:4px 0}
.empty{text-align:center;color:var(--muted);padding:40px 16px}
.loading{color:var(--muted);padding:30px 0;text-align:center}
/* modal */
.ov{position:fixed;inset:0;background:rgba(10,12,16,.55);display:none;align-items:flex-start;justify-content:center;padding:24px 12px;z-index:50;overflow-y:auto}
.ov.on{display:flex}
.modal{background:var(--surface);color:var(--text);border-radius:16px;max-width:860px;width:100%;padding:22px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal .x{position:absolute;right:12px;top:10px;border:0;background:none;font-size:24px;color:var(--muted);cursor:pointer;line-height:1;padding:6px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px 16px;font-size:14px;margin:10px 0}
.kv div span{display:block;color:var(--muted);font-size:12.5px}
.box{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0;background:var(--bg)}
.box p{margin:4px 0;white-space:pre-wrap}
.mrow{display:flex;gap:10px;align-items:flex-start;padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:var(--surface)}
.mrow input{margin-top:4px;accent-color:var(--accent)}
.mrow .score{margin-left:auto;font-size:12px;font-weight:700;color:var(--ok);white-space:nowrap}
.mrow small{color:var(--muted)}
/* admin */
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.subtabs button{border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:7px 13px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
.subtabs button.on{background:var(--text);color:var(--surface);border-color:var(--text)}
.pipe{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.pipe button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font:inherit;font-size:13px;cursor:pointer;color:var(--text);text-align:left}
.pipe button b{display:block;font-size:18px}
.pipe button.on{border-color:var(--accent);background:var(--accent-soft)}
.tbl{width:100%;border-collapse:collapse;font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tbl th{text-align:left;font-size:12.5px;color:var(--muted);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line);background:var(--surface2)}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--accent-soft)}
.tblwrap{overflow-x:auto;border-radius:12px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
.hp{position:absolute;left:-5000px;width:1px;height:1px;overflow:hidden}
@media (max-width:640px){header{position:static}.brand small{display:none}}
footer{color:var(--muted);font-size:13px;text-align:center;padding:24px 16px 40px}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div class="brand">FASS/AI-Synergy-Lab<small data-i18n="tagline"></small></div>
      <div class="lang" role="group" aria-label="Language"><button data-lang="ms">BM</button><button data-lang="en">EN</button></div>
    </div>
    <nav id="nav">
      <button data-view="home" data-i18n="nHome"></button>
      <button data-view="submit" data-i18n="nSubmit"></button>
      <button data-view="expert" data-i18n="nExpert"></button>
      <button data-view="board" data-i18n="nBoard"></button>
      <button data-view="experts" data-i18n="nExperts"></button>
      <button data-view="track" data-i18n="nTrack"></button>
      <button data-view="admin" class="admin" data-i18n="nAdmin"></button>
    </nav>
  </div>
  <div class="demo" id="demoBar" hidden><div class="wrap" data-i18n="demo"></div></div>
</header>

<main class="wrap">
<!-- HOME -->
<section class="view" id="v-home">

<script>
/* ============ KONFIGURASI / CONFIGURATION ============
 * Tampal URL Web App Google Apps Script anda (berakhir dengan /exec) di bawah.
 * Jika kosong, laman berjalan dalam MOD DEMO (data hanya dalam pelayar ini).
 * ===================================================== */
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbwpjGA4-zB7il1sg6hFvFSvQGmjgn8CzLPhINv-6d3icgMraTZtCTMR_LYEzcwIa-iV/exec',
  CONTACT_EMAIL: 'rohayatipaidi@um.edu.my'   // pilihan: e-mel Teras AI untuk dipaparkan di kaki laman
};
</script>
<script>
/* ===================== CORE LOGIC =====================
 * Logik yang sama digunakan oleh Code.gs (pelayan) dan mod demo dalam index.html.
 * Shared by the Apps Script backend and the in-browser demo mode.
 * ====================================================== */
var SCHEMA = {
  Ideas: ['id','createdAt','updatedAt','type','category','title','summary','problem','outcome','needs','sensitivity','timeline','name','email','dept','showName','isPublic','status','feasibility','impact','matchedExperts','teamNotes','publicNote'],
  Experts: ['id','createdAt','updatedAt','role','name','email','dept','expertise','tools','interests','availability','bio','link','isPublic','active','teamNotes'],
  Interests: ['id','createdAt','ideaId','name','email','dept','kind','message'],
  Log: ['time','action','target','detail']
};
var LIST_FIELDS = ['needs','matchedExperts','expertise','interests'];
var V = {
  type: ['project','idea'],
  category: ['research','teaching','admin','ai','other'],
  status: ['new','review','feasible','matched','progress','done','parked','archived'],
  sensitivity: ['no','yes','unsure'],
  timeline: ['asap','semester','year','flexible'],
  availability: ['low','mid','high','project'],
  role: ['associate','core'],
  level: ['','high','medium','low'],
  kind: ['expert','collab','same']
};

function core_str(v, max) {
  v = (v === null || v === undefined) ? '' : String(v);
  v = v.replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '').trim();
  return v.slice(0, max || 500);
}
function core_list(v) {
  if (typeof v === 'string') v = v.split(',');
  if (!Array.isArray(v)) return [];
  var out = [];
  v.forEach(function (x) { x = core_str(x, 40); if (/^[A-Za-z0-9_-]+$/.test(x) && out.indexOf(x) < 0) out.push(x); });
  return out.slice(0, 40);
}
function core_yes(v) { return (v === true || v === 'yes' || v === 'true' || v === 'on') ? 'yes' : 'no'; }
function core_email(v) { v = core_str(v, 120).toLowerCase(); return /^[^\s@,;]+@[^\s@,;]+\.[^\s@,;]+$/.test(v) ? v : ''; }
function core_pick(v, allowed, def) { return allowed.indexOf(v) >= 0 ? v : def; }
function core_url(v) { v = core_str(v, 300); return /^https?:\/\/\S+$/i.test(v) ? v : ''; }
function core_uid(prefix) {
  var abc = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', s = '';
  for (var i = 0; i < 6; i++) s += abc.charAt(Math.floor(Math.random() * abc.length));
  return prefix + '-' + s;
}
function core_decode(o) {
  var r = {};
  for (var k in o) r[k] = LIST_FIELDS.indexOf(k) >= 0 ? core_list(o[k]) : (o[k] === null || o[k] === undefined ? '' : String(o[k]));
  return r;
}
function core_encode(o) {
  var r = {};
  for (var k in o) r[k] = Array.isArray(o[k]) ? o[k].join(',') : o[k];
  return r;
}
function core_all(env, name) { return env.db.all(name).map(core_decode); }
function core_log(env, action, target, detail) {
  try { env.db.insert('Log', { time: env.now(), action: action, target: target, detail: core_str(detail, 300) }); } catch (e) {}
}

function coreHandle(req, env) {
  req = req || {};
  var action = String(req.action || '');
  var pub = {
    ping: function () { return { ok: true, app: 'FASS/AI-Synergy-Lab' }; },
    publicData: core_publicData,
    track: core_track,
    submitIdea: core_submitIdea,
    registerExpert: core_registerExpert,
    expressInterest: core_expressInterest
  };
  var adm = {
    adminLogin: function () { return { ok: true }; },
    adminData: core_adminData,
    updateIdea: core_updateIdea,
    updateExpert: core_updateExpert
  };
  if (pub[action]) return pub[action](req, env);
  if (adm[action]) {
    var pass = env.passcode();
    if (!pass) return { ok: false, error: 'no_passcode' };
    if (String(req.passcode || '') !== String(pass)) { env.sleep(1500); return { ok: false, error: 'auth' }; }
    return adm[action](req, env);
  }
  return { ok: false, error: 'unknown_action' };
}

function core_publicData(req, env) {
  var ideas = core_all(env, 'Ideas'), experts = core_all(env, 'Experts'), ints = core_all(env, 'Interests');
  var icount = {};
  ints.forEach(function (i) { icount[i.ideaId] = (icount[i.ideaId] || 0) + 1; });
  var visibleIdeas = ideas.filter(function (i) { return i.status !== 'archived'; });
  var pubIdeas = visibleIdeas.filter(function (i) { return i.isPublic === 'yes'; }).map(function (i) {
    return { id: i.id, createdAt: i.createdAt, type: i.type, category: i.category, title: i.title, summary: i.summary,
      needs: i.needs, dept: i.dept, name: i.showName === 'yes' ? i.name : '', status: i.status, publicNote: i.publicNote,
      matched: i.matchedExperts.length, interest: icount[i.id] || 0 };
  });
  var activeExperts = experts.filter(function (e) { return e.active !== 'no'; });
  var pubExperts = activeExperts.filter(function (e) { return e.isPublic === 'yes'; }).map(function (e) {
    return { id: e.id, role: e.role, name: e.name, dept: e.dept, expertise: e.expertise, tools: e.tools,
      interests: e.interests, availability: e.availability, bio: e.bio, link: e.link };
  });
  pubIdeas.sort(function (a, b) { return a.createdAt < b.createdAt ? 1 : -1; });
  var matchedSt = ['matched', 'progress', 'done'];
  return { ok: true, ideas: pubIdeas, experts: pubExperts, stats: {
    ideas: visibleIdeas.length,
    experts: activeExperts.length,
    matched: visibleIdeas.filter(function (i) { return matchedSt.indexOf(i.status) >= 0; }).length,
    done: visibleIdeas.filter(function (i) { return i.status === 'done'; }).length
  } };
}

function core_track(req, env) {
  var ref = core_str(req.ref, 20).toUpperCase();
  if (!ref) return { ok: false, error: 'missing' };
  var experts = core_all(env, 'Experts');
  var byId = {};
  experts.forEach(function (e) { byId[e.id] = e; });
  var ideas = core_all(env, 'Ideas');
  var idea = ideas.filter(function (i) { return i.id === ref; })[0];
  if (idea) {
    return { ok: true, kind: 'idea', id: idea.id, title: idea.title, status: idea.status, publicNote: idea.publicNote,
      updatedAt: idea.updatedAt, matched: idea.matchedExperts.map(function (id) { return byId[id] ? byId[id].name : null; }).filter(Boolean) };
  }
  var ex = byId[ref];
  if (ex) {
    return { ok: true, kind: 'expert', id: ex.id, name: ex.name, role: ex.role, active: ex.active, updatedAt: ex.updatedAt,
      ideas: ideas.filter(function (i) { return i.matchedExperts.indexOf(ex.id) >= 0 && i.status !== 'archived'; })
        .map(function (i) { return { id: i.id, title: i.title, status: i.status }; }) };
  }
  return { ok: false, error: 'not_found' };
}

function core_submitIdea(req, env) {
  var d = req.data || {};
  if (core_str(d.website)) return { ok: true, id: core_uid('FASS') }; // honeypot (spam bot)
  var now = env.now();
  var idea = {
    id: core_uid('FASS'), createdAt: now, updatedAt: now,
    type: core_pick(d.type, V.type, 'idea'),
    category: core_pick(d.category, V.category, 'other'),
    title: core_str(d.title, 160), summary: core_str(d.summary, 600),
    problem: core_str(d.problem, 3000), outcome: core_str(d.outcome, 2000),
    needs: core_list(d.needs),
    sensitivity: core_pick(d.sensitivity, V.sensitivity, 'unsure'),
    timeline: core_pick(d.timeline, V.timeline, 'flexible'),
    name: core_str(d.name, 120), email: core_email(d.email), dept: core_str(d.dept, 120),
    showName: core_yes(d.showName), isPublic: core_yes(d.isPublic),
    status: 'new', feasibility: '', impact: '', matchedExperts: [], teamNotes: '', publicNote: ''
  };
  if (!idea.title || !idea.summary || !idea.name || !idea.email) return { ok: false, error: 'missing' };
  env.db.insert('Ideas', core_encode(idea));
  core_log(env, 'submitIdea', idea.id, idea.title);
  env.notify('[AI-Synergy-Lab] Idea baharu: ' + idea.title,
    'Rujukan: ' + idea.id + '\nDaripada: ' + idea.name + ' (' + idea.dept + ')\nKategori: ' + idea.category + '\n\n' + idea.summary);
  return { ok: true, id: idea.id };
}

function core_registerExpert(req, env) {
  var d = req.data || {};
  if (core_str(d.website)) return { ok: true, id: core_uid('PAKAR') };
  var email = core_email(d.email);
  var now = env.now();
  var ex = {
    role: 'associate', name: core_str(d.name, 120), email: email, dept: core_str(d.dept, 120),
    expertise: core_list(d.expertise), tools: core_str(d.tools, 500), interests: core_list(d.interests),
    availability: core_pick(d.availability, V.availability, 'project'), bio: core_str(d.bio, 1200),
    link: core_url(d.link), isPublic: core_yes(d.isPublic), updatedAt: now
  };
  if (!ex.name || !ex.email || !ex.expertise.length) return { ok: false, error: 'missing' };
  // One profile per e-mail: re-registering updates the existing profile (keeps role & team notes).
  var existing = core_all(env, 'Experts').filter(function (e) { return e.email === email; })[0];
  if (existing) {
    delete ex.role;
    env.db.update('Experts', existing.id, core_encode(ex));
    core_log(env, 'updateProfile', existing.id, ex.name);
    return { ok: true, id: existing.id, updated: true };
  }
  ex.id = core_uid('PAKAR'); ex.createdAt = now; ex.active = 'yes'; ex.teamNotes = '';
  env.db.insert('Experts', core_encode(ex));
  core_log(env, 'registerExpert', ex.id, ex.name);
  env.notify('[AI-Synergy-Lab] Pakar baharu: ' + ex.name, 'Rujukan: ' + ex.id + '\n' + ex.dept + '\nKepakaran: ' + ex.expertise.join(', '));
  return { ok: true, id: ex.id };
}

function core_expressInterest(req, env) {
  var d = req.data || {};
  if (core_str(d.website)) return { ok: true };
  var ideaId = core_str(d.ideaId, 20).toUpperCase();
  var idea = core_all(env, 'Ideas').filter(function (i) { return i.id === ideaId && i.isPublic === 'yes' && i.status !== 'archived'; })[0];
  if (!idea) return { ok: false, error: 'not_found' };
  var it = { id: core_uid('MINAT'), createdAt: env.now(), ideaId: ideaId, name: core_str(d.name, 120), email: core_email(d.email),
    dept: core_str(d.dept, 120), kind: core_pick(d.kind, V.kind, 'collab'), message: core_str(d.message, 1500) };
  if (!it.name || !it.email) return { ok: false, error: 'missing' };
  env.db.insert('Interests', core_encode(it));
  core_log(env, 'expressInterest', ideaId, it.name);
  env.notify('[AI-Synergy-Lab] Minat baharu untuk ' + ideaId, it.name + ' (' + it.email + ') berminat dengan "' + idea.title + '"\n\n' + it.message);
  return { ok: true, id: it.id };
}

function core_adminData(req, env) {
  return { ok: true, ideas: core_all(env, 'Ideas'), experts: core_all(env, 'Experts'), interests: core_all(env, 'Interests') };
}

function core_updateIdea(req, env) {
  var id = core_str(req.id, 20), p = req.patch || {};
  var idea = core_all(env, 'Ideas').filter(function (i) { return i.id === id; })[0];
  if (!idea) return { ok: false, error: 'not_found' };
  var upd = { updatedAt: env.now() };
  if ('status' in p) upd.status = core_pick(p.status, V.status, idea.status);
  if ('feasibility' in p) upd.feasibility = core_pick(p.feasibility, V.level, '');
  if ('impact' in p) upd.impact = core_pick(p.impact, V.level, '');
  if ('category' in p) upd.category = core_pick(p.category, V.category, idea.category);
  if ('isPublic' in p) upd.isPublic = core_yes(p.isPublic);
  if ('title' in p && core_str(p.title, 160)) upd.title = core_str(p.title, 160);
  if ('summary' in p && core_str(p.summary, 600)) upd.summary = core_str(p.summary, 600);
  if ('teamNotes' in p) upd.teamNotes = core_str(p.teamNotes, 3000);
  if ('publicNote' in p) upd.publicNote = core_str(p.publicNote, 1500);
  if ('matchedExperts' in p) {
    var ids = {};
    core_all(env, 'Experts').forEach(function (e) { ids[e.id] = 1; });

  }
  env.db.update('Ideas', id, core_encode(upd));
  core_log(env, 'updateIdea', id, JSON.stringify(upd));
  return { ok: true };
}

function core_updateExpert(req, env) {
  var id = core_str(req.id, 20), p = req.patch || {};
  var ex = core_all(env, 'Experts').filter(function (e) { return e.id === id; })[0];
  if (!ex) return { ok: false, error: 'not_found' };
  var upd = { updatedAt: env.now() };
  if ('role' in p) upd.role = core_pick(p.role, V.role, ex.role);
  if ('isPublic' in p) upd.isPublic = core_yes(p.isPublic);
  if ('active' in p) upd.active = core_yes(p.active);
  if ('teamNotes' in p) upd.teamNotes = core_str(p.teamNotes, 3000);
  env.db.update('Experts', id, core_encode(upd));
  core_log(env, 'updateExpert', id, JSON.stringify(upd));
  return { ok: true };
}

async function api(action, payload) {
  const req = Object.assign({ action }, payload || {});
  let res;
  if (DEMO) {
    await new Promise(r => setTimeout(r, 150));
    res = coreHandle(JSON.parse(JSON.stringify(req)), demoEnv());
  } else {
    try {
      const r = await fetch(CONFIG.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(req), redirect: 'follow' });
      res = await r.json();
    } catch (e) { throw new Error('network'); }
  }
  if (!res || !res.ok) throw new Error((res && res.error) || 'server');
  return res;
}

function formData(form) {
  const o = {};
  new FormData(form).forEach((v, k) => {
    const el = form.querySelector(`[name="${k}"]`);
    if (el && el.type === 'checkbox' && !['isPublic', 'showName'].includes(k)) (o[k] = o[k] || []).push(v);
    else o[k] = v;
  });
  ['isPublic', 'showName'].forEach(k => { const el = form.querySelector(`[name="${k}"]`); if (el) o[k] = el.checked ? 'yes' : 'no'; });
  return o;
}
async function busy(btn, fn) {
  const txt = btn.textContent; btn.disabled = true; btn.textContent = t('sending');
  try { return await fn(); } finally { btn.disabled = false; btn.textContent = txt; }
}

function matchScore(idea, ex, ints) {
  if (ex.active === 'no') return { s: -1, hits: [] };
  const hits = (idea.needs || []).filter(n => (ex.expertise || []).includes(n));
  let s = hits.length * 3;
  if ((ex.interests || []).includes(idea.category)) s += 1;
  if (ints.some(i => i.ideaId === idea.id && i.email && i.email === ex.email)) s += 4;
  if (ex.role === 'core' && s > 0) s += 0.5;
  return { s, hits };
}

function csvCell(v) { v = Array.isArray(v) ? v.join(', ') : String(v ?? ''); if (/^[=+\-@]/.test(v)) v = "'" + v; return '"' + v.replace(/"/g, '""') + '"'; }
$('#admCsv').onclick = () => {
  const D = ADM.data; if (!D) return;
  const key = ADM.tab === 'experts' ? 'Experts' : ADM.tab === 'interests' ? 'Interests' : 'Ideas';
  const rows = D[ADM.tab === 'experts' ? 'experts' : ADM.tab === 'interests' ? 'interests' : 'ideas'];
  const cols = SCHEMA[key];
  const csv = '﻿' + [cols.join(',')].concat(rows.map(r => cols.map(c => csvCell(r[c])).join(','))).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = 'ai-synergy-lab-' + key.toLowerCase() + '-' + new Date().toISOString().slice(0, 10) + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
};
